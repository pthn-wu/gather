<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Gather API</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #faf7f2;
        color: #2c2622;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #17140f; color: #e8e2d8; }
      }
      main { max-width: 30rem; padding: 2rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 0.75rem; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gather API</h1>
      <p>
        This host serves the Gather API. There is nothing to browse here — the
        site is deployed separately, with the storefront at <code>/</code> and
        the back office at <code>/office</code>.
      </p>
      <p><code>GET /health</code> reports whether the service is up.</p>
    </main>
  </body>
</html>
