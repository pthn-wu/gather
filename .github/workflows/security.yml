name: Security

# Static analysis gate. Deployment depends on this workflow passing — see
# deploy.yml, which needs the `security-gate` job below.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependencies rot even when the code does not. Re-scan weekly so a newly
    # disclosed CVE in a pinned package surfaces without waiting for a commit.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Secrets. Runs first and fast — a leaked key in the diff makes everything
  # else moot.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history to scan the whole diff range
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Semgrep — the main SAST pass. `p/owasp-top-ten` and the JS/TS rulesets cover
  # injection, XSS, auth and crypto misuse; the local ruleset adds this
  # project's own invariants.
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --config .semgrep.yml \
            --error \
            --sarif --output semgrep.sarif \
            --metrics off
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # CodeQL — deeper dataflow analysis than pattern matching can give.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------------------
  # Per-workspace checks: typecheck, dependency audit, and the project's own
  # parameterized-query guard.
  # ---------------------------------------------------------------------------
  workspaces:
    name: Checks (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [server, web, admin, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.workspace }}
        run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          EXPO_NO_TELEMETRY: '1'

      # Prisma's client must exist before the server typechecks.
      - name: Generate Prisma client
        if: matrix.workspace == 'server'
        working-directory: server
        run: npx prisma generate

      - name: Typecheck
        working-directory: ${{ matrix.workspace }}
        run: npx tsc --noEmit

      # Fails the build on a known-vulnerable dependency. `high` is the gate;
      # moderate findings are reported but do not block.
      - name: npm audit (high+)
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high

      - name: npm audit (report only)
        if: always()
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=moderate || true

  sql-safety:
    name: Parameterized queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fails on $queryRawUnsafe / $executeRawUnsafe / concatenated SQL anywhere
      # in the server. Prisma parameterizes by default; this stops a future
      # change from reaching past it.
      - run: node scripts/check-sql-safety.mjs

  # ---------------------------------------------------------------------------
  # Blocks a PR that introduces a dependency with a known vulnerability or an
  # incompatible licence, before it is ever merged.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # The gate. Deployment requires this job, so it must fail if any scan failed —
  # note the explicit result check: `needs` alone does not fail a job when a
  # dependency is skipped.
  # ---------------------------------------------------------------------------
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [secrets, semgrep, codeql, workspaces, sql-safety]
    if: always()
    steps:
      - name: Verify all scans passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Scan results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A security scan did not pass ($r). Deployment is blocked."
              exit 1
            fi
          done
          echo "All security scans passed."
